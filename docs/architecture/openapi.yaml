openapi: 3.1.0
info:
  title: Maricho API
  description: Backend API for the Maricho skilled work platform.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Verifies the API process is running.
      responses:
        '200':
          description: API is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
  /health/ready:
    get:
      summary: Readiness probe
      description: Verifies downstream dependencies (PostgreSQL, Redis).
      responses:
        '200':
          description: System is ready to accept traffic
        '503':
          description: Dependencies are unreachable
  /token:
    post:
      summary: Log in (mock — phone number only, no real verification yet)
      description: >
        Finds a Person by phone, or creates one. `role` only takes effect
        when this phone number doesn't have an account yet — an existing
        account's role never changes via a later login. In production this
        would be replaced by WhatsApp OTP verification (ADR-006, backlog
        BACK-009) — this is an explicitly documented dev-only stand-in.
        Request body is form-urlencoded (OAuth2 password-flow field
        naming): `username` is the phone number, `password` is unused.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: Phone number.
                password:
                  type: string
                  description: Unused — accepted for OAuth2 password-flow shape only.
                role:
                  type: string
                  enum: [BUYER, WORKER, AGGREGATOR, OPS]
                  default: BUYER
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
        '422':
          description: Missing username, or role is not a recognized value
  /users/me:
    get:
      summary: Fetch the authenticated user's own account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  phone:
                    type: string
                  role:
                    type: string
                    enum: [BUYER, WORKER, AGGREGATOR, OPS]
        '401':
          description: Missing or invalid bearer token
  /jobs/request:
    post:
      summary: Create a Quick Hire job request
      description: >
        Buyer submits a problem description (text, or a voice-note transcript
        arriving as text from the WhatsApp/client channel). The buyer is taken
        from the bearer token, not the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trade
                - suburb
                - address
                - problem_description
              properties:
                trade:
                  type: string
                  enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
                suburb:
                  type: string
                address:
                  type: string
                  description: >
                    Exact street address. Stored at request time but only
                    ever shown to the buyer, the assigned worker (from
                    booking onward), or OPS — never to unassigned match
                    candidates.
                landmark_narrative:
                  type: string
                  nullable: true
                  description: >-
                    Optional navigation description, gated the same as
                    address. See ADR-004.
                latitude:
                  type: number
                  nullable: true
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  nullable: true
                  minimum: -180
                  maximum: 180
                problem_description:
                  type: string
                problem_photo_url:
                  type: string
                  nullable: true
                budget_amount:
                  type: number
                  nullable: true
                  exclusiveMinimum: 0
                  description: >-
                    Optional stated budget — informational only, never
                    enforced against the eventual deposit/quote amounts.
      responses:
        '201':
          description: Job requested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Authenticated user is not a BUYER
        '422':
          description: >-
            Invalid input (missing/blank suburb or description, unknown
            suburb, or out-of-range latitude/longitude)
  /jobs/mine:
    get:
      summary: List the authenticated buyer's own jobs
      description: >
        This buyer's own jobs, newest first, each annotated with
        `offer_count` (the number of worker-submitted JobOffers on it).
        Restricted to BUYER role.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: This buyer's jobs (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyJob'
        '403':
          description: Authenticated user is not a BUYER
  /jobs/open:
    get:
      summary: List open jobs this worker could still submit an offer on
      description: >
        Jobs across the authenticated worker's own trades that are still
        REQUESTED or MATCHED and within range (SAME_SUBURB/NEARBY/MODERATE;
        FAR excluded) of one of their declared service areas — the
        worker-facing reverse view of matching, for submitting a JobOffer
        via POST /jobs/{job_id}/offers. Ranked by distance band then
        recency. Deliberately omits address/landmark_narrative/
        latitude/longitude/buyer_id — matches the existing "address hidden
        from workers until booking" principle. Restricted to WORKER role.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Open jobs (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenJob'
        '403':
          description: Authenticated user is not a WORKER
  /jobs/assigned:
    get:
      summary: List the authenticated worker's own jobs
      description: >
        This worker's own jobs (any status), newest first. Restricted to
        WORKER role.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: This worker's jobs (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '403':
          description: Authenticated user is not a WORKER
  /jobs/my-offers:
    get:
      summary: List the authenticated worker's own submitted offers
      description: >
        This worker's own JobOffers, across all jobs, each flattened with
        enough job context (trade/suburb/status) to render without a
        second fetch per row. Restricted to WORKER role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: This worker's offers (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyOffer'
        '403':
          description: Authenticated user is not a WORKER
  /jobs/{job_id}:
    get:
      summary: Fetch a job
      description: >
        Restricted to the job's buyer, its assigned worker, or an OPS user.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
  /jobs/{job_id}/matches:
    get:
      summary: Run the matching engine and return ranked worker candidates
      description: >
        Returns up to 3 workers filtered to the job's trade, ranked primarily
        by distance band (SAME_SUBURB > NEARBY > MODERATE; FAR is excluded)
        and secondarily by standing (grade, on-time rate, dispute rate, fill
        rate) within the same band. Distance is computed via haversine
        distance between suburb centroids (see the `suburbs` reference
        table). Excludes workers currently tied to another active job. Each
        candidate includes a `reason` explaining the match. If a candidate
        has submitted a JobOffer for this job (POST /jobs/{job_id}/offers),
        `quoted_amount`/`availability_note`/`quoted_at` are populated —
        `null` otherwise. The first call on a REQUESTED job transitions it
        to MATCHED; a job past BOOKED no longer accepts matches. Restricted
        to the job's buyer.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Up to 3 ranked candidates (possibly empty)
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/MatchCandidate'
        '403':
          description: Authenticated user is not this job's buyer
        '404':
          description: Job not found
        '409':
          description: Job is no longer accepting matches (already BOOKED or later)
  /jobs/{job_id}/offers:
    post:
      summary: Submit or revise a worker's own offer on a still-open job
      description: >
        A worker (not yet booked) attaches their own price + availability
        to a job that's still REQUESTED or MATCHED. Resubmitting revises
        the existing offer (upsert) rather than erroring. Restricted to
        WORKER role.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferCreate'
      responses:
        '201':
          description: Offer submitted or revised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOffer'
        '403':
          description: Authenticated user is not a WORKER
        '404':
          description: Job not found
        '409':
          description: >-
            Job is no longer open for offers (already BOOKED or later), or
            the worker is already committed to another active job
        '422':
          description: Worker is not skilled in this job's trade
  /jobs/{job_id}/book:
    post:
      summary: Book a matched worker
      description: >
        Buyer picks one of the matched workers, holds a deposit
        (DEPOSIT_HELD ledger entry), and reveals the exact address to the
        worker. The chosen worker must be a registered WORKER with a skill
        in this job's trade and not already tied to another active job.
        `currency` (ADR-002, default USD) is set once here and reused by
        every later ledger entry for this job. When `currency` is
        `ECOCASH`, a real collection request is initiated from the buyer
        before the booking completes — see 503/502 below.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, deposit_amount]
              properties:
                worker_id:
                  type: string
                  format: uuid
                deposit_amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  enum: [USD, ECOCASH, ZWG]
                  default: USD
      responses:
        '200':
          description: Job booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: Authenticated user is not this job's buyer
        '404':
          description: Job not found
        '409':
          description: Job is not MATCHED, or the worker is already committed elsewhere
        '422':
          description: worker_id does not refer to a registered, skilled worker
        '502':
          description: currency was ECOCASH and the collection request failed
        '503':
          description: currency was ECOCASH and no gateway config exists yet
  /jobs/{job_id}/quote:
    post:
      summary: Assigned worker submits their on-site price
      description: >
        Two-tier quoting (ADR-003): the worker submits a labor amount and a
        materials amount separately; quote_amount is computed server-side as
        their sum (labor + materials), never accepted directly from the
        client. Commits the remaining balance (quote minus the deposit
        already held) as a BALANCE_COMMITTED ledger entry and moves the job
        to IN_PROGRESS. Only the job's assigned worker may call this.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labor_amount, materials_amount]
              properties:
                labor_amount:
                  type: number
                  exclusiveMinimum: 0
                materials_amount:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: Authenticated user is not this job's assigned worker
        '404':
          description: Job not found
        '409':
          description: Job is not BOOKED
        '422':
          description: Quote does not exceed the deposit already held
  /jobs/{job_id}/complete:
    post:
      summary: Buyer signs off and releases payment
      description: >
        Writes the immutable RecordEntry and a RELEASED ledger entry (the
        full quote amount). Only the job's buyer may call this.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [what_was_done]
              properties:
                what_was_done:
                  type: string
                client_words:
                  type: string
                  nullable: true
                before_photo_url:
                  type: string
                  nullable: true
                after_photo_url:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Job completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: Authenticated user is not this job's buyer
        '404':
          description: Job not found
        '409':
          description: Job is not IN_PROGRESS
  /jobs/{job_id}/dispute:
    post:
      summary: Buyer raises a dispute
      description: >
        Money freezes: the job moves to DISPUTED and no further ledger
        release can happen until the worker responds. "Design for the
        worker's worst day" — the worker's standing is frozen, not dropped,
        while the dispute is open (see GET /workers/me/standing).
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          description: Authenticated user is not this job's buyer
        '404':
          description: Job not found
        '409':
          description: Job is not IN_PROGRESS
  /jobs/{job_id}/dispute/respond:
    post:
      summary: Assigned worker answers the dispute
      description: >
        Default outcome is a return visit, not a refund: the dispute
        resolves to RESOLVED_RETURN_VISIT and the job goes back to
        IN_PROGRESS so the worker can fix the issue and the buyer can
        complete normally afterward. Only the job's assigned worker may
        call this. Photos are attached as part of the response, not
        sourced automatically — there is no separate execution-phase photo
        upload endpoint yet.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                before_photo_url:
                  type: string
                  nullable: true
                after_photo_url:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '403':
          description: Authenticated user is not this job's assigned worker
        '404':
          description: Job not found, or no open dispute
        '409':
          description: Job is not currently DISPUTED
  /jobs/{job_id}/disputes:
    get:
      summary: List a job's disputes
      description: Restricted to the job's buyer, its assigned worker, or an OPS user.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Disputes, oldest first, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispute'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
  /jobs/{job_id}/ledger:
    get:
      summary: View a job's ledger entries
      description: Restricted to the job's buyer, its assigned worker, or an OPS user.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Ledger entries, oldest first, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
  /jobs/{job_id}/record:
    get:
      summary: View a job's immutable record entry
      description: Restricted to the job's buyer, its assigned worker, or an OPS user.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Record entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordEntry'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found, or no record entry yet (job not completed)
  /jobs/{job_id}/messages:
    post:
      summary: Send a message in this job's conversation
      description: >-
        Restricted to the job's buyer or assigned worker (or OPS) —
        enforced inside the use case, not a role gate, since either role
        may be either party. `TEXT` requires `body`; `VOICE_NOTE`/`PHOTO`
        require `media_url` (a client-supplied URL string — no upload
        storage exists in this backend); `LOCATION` requires
        `latitude`/`longitude`. Published to connected WebSocket clients
        (see below) after the write commits.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_type]
              properties:
                message_type:
                  type: string
                  enum: [TEXT, VOICE_NOTE, PHOTO, LOCATION]
                body:
                  type: string
                  nullable: true
                media_url:
                  type: string
                  nullable: true
                duration_seconds:
                  type: integer
                  nullable: true
                latitude:
                  type: number
                  nullable: true
                longitude:
                  type: number
                  nullable: true
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
        '422':
          description: >-
            message_type's required field (body/media_url/lat+lng) is missing
    get:
      summary: List this job's messages
      description: Oldest-first. Restricted to the job's buyer or assigned worker (or OPS).
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: This job's messages (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
  /jobs/{job_id}/messages/read:
    post:
      summary: Mark this job's unread messages (from the other party) as read
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked read
        '403':
          description: Authenticated user is not a party to this job
        '404':
          description: Job not found
  /jobs/{job_id}/ws:
    description: >-
      **WebSocket**, not representable in OpenAPI 3.1's path syntax —
      documented here in prose instead. Connect with
      `?token=<JWT access token>` (query param, not a header — WebSocket
      handshakes can't reliably carry a bearer Authorization header
      across all client platforms). Rejected before `accept()` (surfaces
      as a flat HTTP 403/404, not a WS close frame — standard ASGI
      behavior) if the token is invalid, the job doesn't exist, or the
      authenticated user isn't a party to it. Once accepted, the socket
      is receive-only from the client's perspective: it pushes every
      message sent via `POST /jobs/{job_id}/messages` above, in real
      time, via Redis pub/sub (so it works regardless of which backend
      process holds the connection) — sending a message always goes
      through that REST endpoint, never through the socket itself.
  /workers/me/skills:
    post:
      summary: Register a skill (trade) for the current worker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trade]
              properties:
                trade:
                  type: string
                  enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
                proof_url:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Skill registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '403':
          description: Authenticated user is not a WORKER
        '409':
          description: Skill already registered for this trade
    get:
      summary: List the current worker's registered skills
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Skills for this worker, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/service-areas:
    post:
      summary: Register a service area (suburb) for the current worker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suburb]
              properties:
                suburb:
                  type: string
                travel_means:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Service area registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceArea'
        '403':
          description: Authenticated user is not a WORKER
        '409':
          description: Service area already registered for this suburb
        '422':
          description: Unknown suburb
    get:
      summary: List the current worker's registered service areas
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Service areas for this worker, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceArea'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/standing:
    get:
      summary: View the current worker's standing
      description: >
        Standing is computed, never assigned. A worker with no standings row
        yet (nothing registered) gets the same defaults a new row would have.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Standing for this worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standing'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/vetting:
    get:
      summary: View the current worker's vetting evidence and computed grade
      description: >
        Progressive vetting tiers (ADR-005). grade is computed from
        accumulated evidence — never assigned directly.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vetting status for this worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVetting'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/vetting/id-photo:
    post:
      summary: Submit (or replace) ID-photo evidence
      description: >
        Gates REGISTERED -> IDENTIFIED (ADR-005). Grade is recomputed
        immediately from all accumulated evidence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_photo_url]
              properties:
                id_photo_url:
                  type: string
      responses:
        '200':
          description: ID photo recorded, grade recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVetting'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/references:
    post:
      summary: Add a contactable reference
      description: Gates IDENTIFIED -> APPRENTICE (ADR-005).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Reference recorded, grade recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerReference'
        '403':
          description: Authenticated user is not a WORKER
    get:
      summary: List the current worker's submitted references
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: References for this worker, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerReference'
        '403':
          description: Authenticated user is not a WORKER
  /workers/me/vouches:
    post:
      summary: Vouch for another worker
      description: >
        Gates APPRENTICE -> JOURNEYMAN/EXPERT (ADR-005). Only workers whose
        own current grade is JOURNEYMAN or EXPERT may vouch. Recomputes the
        *vouched-for* worker's grade, not the voucher's.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Vouch recorded, vouched-for worker's grade recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerVouch'
        '403':
          description: >-
            Authenticated user is not a WORKER, or their grade is below
            JOURNEYMAN
        '409':
          description: This voucher has already vouched for this worker
        '422':
          description: >-
            Self-vouch attempted, or worker_id does not refer to a
            registered worker
  /suburbs:
    get:
      summary: List known suburbs and their centroids
      description: >
        Public reference data for building a suburb picker (icons/list)
        client-side rather than free-text entry. No authentication required.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Known suburbs, alphabetical, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suburb'
  /crews/me:
    post:
      summary: Create the current AGGREGATOR's crew
      description: One crew per lead (enforced by a unique constraint).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Crew created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '403':
          description: Authenticated user is not an AGGREGATOR
        '409':
          description: Already has a crew registered
    get:
      summary: View the current AGGREGATOR's crew and its members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Crew found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '403':
          description: Authenticated user is not an AGGREGATOR
        '404':
          description: No crew registered yet
  /crews/me/members:
    post:
      summary: Add a worker to the current AGGREGATOR's crew
      description: >
        The crew lead directly manages their roster — there is no invite/
        accept sub-workflow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '403':
          description: Authenticated user is not an AGGREGATOR
        '404':
          description: No crew registered yet
        '409':
          description: Worker is already a member of this crew
        '422':
          description: worker_id does not refer to a registered worker
  /crews/me/members/{worker_id}:
    delete:
      summary: Remove a worker from the current AGGREGATOR's crew
      security:
        - bearerAuth: []
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '403':
          description: Authenticated user is not an AGGREGATOR
        '404':
          description: No crew registered, or worker is not a member
  /crew-orders/request:
    post:
      summary: Request a crew (Crew Hire)
      description: >
        An organization requests N workers of a trade for a site. Stage Two
        scope (business case names this a self-service "Crew Hire console");
        built ahead of the phased rollout at the user's request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trade, suburb, address, workers_needed]
              properties:
                trade:
                  type: string
                  enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
                suburb:
                  type: string
                address:
                  type: string
                landmark_narrative:
                  type: string
                  nullable: true
                  description: >-
                    Optional navigation description, gated the same as
                    address. See ADR-004.
                latitude:
                  type: number
                  nullable: true
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  nullable: true
                  minimum: -180
                  maximum: 180
                workers_needed:
                  type: integer
                  minimum: 1
                problem_description:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Crew order requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOrder'
        '403':
          description: Authenticated user is not a BUYER
        '422':
          description: >-
            Invalid input, unknown suburb, or out-of-range
            latitude/longitude
  /crew-orders/{order_id}:
    get:
      summary: Fetch a crew order
      description: >
        Restricted to the order's buyer, the booked crew's lead, or an OPS
        user.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Crew order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOrder'
        '403':
          description: Authenticated user is not a party to this crew order
        '404':
          description: Crew order not found
  /crew-orders/{order_id}/matches:
    get:
      summary: Run the crew matching engine and return ranked crew candidates
      description: >
        Returns up to 3 crews with enough qualifying members (matching
        trade, within distance, individually available) to fill the order,
        ranked by distance band then qualifying-member count. The first
        call on a REQUESTED order transitions it to MATCHED. Restricted to
        the order's buyer.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Up to 3 ranked crew candidates (possibly empty)
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/CrewMatchCandidate'
        '403':
          description: Authenticated user is not this order's buyer
        '404':
          description: Crew order not found
        '409':
          description: Crew order is no longer accepting matches
  /crew-orders/{order_id}/book:
    post:
      summary: Book a matched crew
      description: >
        Holds the deposit (DEPOSIT_HELD). The crew becomes unavailable as a
        whole for other orders until this one completes. `currency`
        (ADR-002, default USD) is set once here and reused by every later
        ledger entry. When `currency` is `ECOCASH`, a real collection
        request is initiated from the buyer before booking completes.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crew_id, deposit_amount]
              properties:
                crew_id:
                  type: string
                  format: uuid
                deposit_amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  enum: [USD, ECOCASH, ZWG]
                  default: USD
      responses:
        '200':
          description: Crew order booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOrder'
        '403':
          description: Authenticated user is not this order's buyer
        '404':
          description: Crew order not found
        '409':
          description: Order is not MATCHED, or the crew is already committed elsewhere
        '422':
          description: crew_id does not refer to a registered crew
        '502':
          description: currency was ECOCASH and the collection request failed
        '503':
          description: currency was ECOCASH and no gateway config exists yet
  /crew-orders/{order_id}/quote:
    post:
      summary: Booked crew's lead submits their on-site price
      description: >
        Two-tier quoting (ADR-003): the crew lead submits a labor amount and
        a materials amount separately; quote_amount is computed server-side
        as their sum, never accepted directly from the client. Commits the
        remaining balance (BALANCE_COMMITTED) and moves the order to
        IN_PROGRESS. Only the booked crew's lead may call this.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labor_amount, materials_amount]
              properties:
                labor_amount:
                  type: number
                  exclusiveMinimum: 0
                materials_amount:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOrder'
        '403':
          description: Authenticated user is not the booked crew's lead
        '404':
          description: Crew order not found
        '409':
          description: Order is not BOOKED
        '422':
          description: Quote does not exceed the deposit already held
  /crew-orders/{order_id}/complete:
    post:
      summary: Buyer signs off and releases payment
      description: >
        Writes a RELEASED ledger entry (the full quote amount) and sets
        `completion_note`. No per-worker RecordEntry is produced for crew
        orders. Only the order's buyer may call this.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [what_was_done]
              properties:
                what_was_done:
                  type: string
      responses:
        '200':
          description: Crew order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOrder'
        '403':
          description: Authenticated user is not this order's buyer
        '404':
          description: Crew order not found
        '409':
          description: Order is not IN_PROGRESS
  /crew-orders/{order_id}/ledger:
    get:
      summary: View a crew order's ledger entries
      description: >
        Restricted to the order's buyer, the booked crew's lead, or an OPS
        user.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Ledger entries, oldest first, paginated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewOrderLedgerEntry'
        '403':
          description: Authenticated user is not a party to this crew order
        '404':
          description: Crew order not found
  /admin/payment-gateways/ecocash:
    get:
      summary: View the EcoCash gateway configuration
      description: OPS-only. api_key is never returned — only whether one is set.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current EcoCash configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoCashConfig'
        '403':
          description: Authenticated user is not OPS
        '404':
          description: EcoCash is not configured yet
    put:
      summary: Set (or replace) the EcoCash gateway configuration
      description: >
        OPS-only. Entered/rotated from the running system, not via env
        vars (ADR-002) — credentials can change without a redeploy.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant_code:
                  type: string
                  nullable: true
                api_key:
                  type: string
                  nullable: true
                base_url:
                  type: string
                  nullable: true
                is_sandbox:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoCashConfig'
        '403':
          description: Authenticated user is not OPS
  /webhooks/ecocash:
    post:
      summary: Receive an EcoCash payment-confirmation callback
      description: >
        Logs the callback as a raw, append-only audit record
        (EcoCashCallbackLog) keyed by reference — not reconciled into the
        immutable ledger tables by mutation. Authenticated via a bearer
        token matching the configured api_key — a placeholder, not a
        confirmed EcoCash signature scheme (see app/ecocash.py). No
        request body validation beyond requiring a reference field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
                status:
                  type: string
                  nullable: true
                amount:
                  type: number
                  nullable: true
                msisdn:
                  type: string
                  nullable: true
      responses:
        '204':
          description: Callback logged
        '401':
          description: Missing or incorrect Authorization header
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      description: Maximum rows to return.
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Rows to skip before collecting the result set.
  schemas:
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [REQUESTED, MATCHED, BOOKED, IN_PROGRESS, DISPUTED, COMPLETED, CANCELLED]
        trade:
          type: string
          enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
        suburb:
          type: string
        address:
          type: string
          description: Only present for the buyer, the assigned worker, or OPS.
        landmark_narrative:
          type: string
          nullable: true
          description: >-
            Optional navigation description (e.g. "blue gate opposite the
            clinic"), gated the same as address.
        latitude:
          type: number
          nullable: true
          description: Optional GPS pin, gated the same as address.
        longitude:
          type: number
          nullable: true
          description: Optional GPS pin, gated the same as address.
        problem_description:
          type: string
          nullable: true
        problem_photo_url:
          type: string
          nullable: true
        budget_amount:
          type: number
          nullable: true
          description: >-
            Optional stated budget — informational only, never enforced
            against the eventual deposit/quote amounts.
        currency:
          type: string
          enum: [USD, ECOCASH, ZWG]
          nullable: true
          description: Set once at booking (ADR-002); nullable until then.
        labor_amount:
          type: number
          nullable: true
          description: Set together with materials_amount by POST /jobs/{id}/quote (ADR-003).
        materials_amount:
          type: number
          nullable: true
        quote_amount:
          type: number
          nullable: true
          description: Computed server-side as labor_amount + materials_amount.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MyJob:
      description: Job plus the number of worker-submitted JobOffers.
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            offer_count:
              type: integer
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        amount:
          type: number
        entry_type:
          type: string
          enum: [DEPOSIT_HELD, BALANCE_COMMITTED, RELEASED, REFUNDED]
        currency:
          type: string
          enum: [USD, ECOCASH, ZWG]
        external_reference:
          type: string
          nullable: true
          description: Gateway transaction reference (ADR-002), set only for ECOCASH entries.
        created_at:
          type: string
          format: date-time
    RecordEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        what_was_done:
          type: string
        client_words:
          type: string
          nullable: true
        before_photo_url:
          type: string
          nullable: true
        after_photo_url:
          type: string
          nullable: true
        signed_off_at:
          type: string
          format: date-time
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        message_type:
          type: string
          enum: [TEXT, VOICE_NOTE, PHOTO, LOCATION]
        body:
          type: string
          nullable: true
        media_url:
          type: string
          nullable: true
          description: Client-supplied URL — no upload storage exists in this backend.
        duration_seconds:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        raised_by_id:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum: [OPEN, RESOLVED_RETURN_VISIT]
        worker_response:
          type: string
          nullable: true
        before_photo_url:
          type: string
          nullable: true
        after_photo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
    MatchCandidate:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        suburb:
          type: string
        travel_means:
          type: string
          nullable: true
        distance_band:
          type: string
          enum: [SAME_SUBURB, NEARBY, MODERATE, FAR]
        distance_km:
          type: number
        grade:
          type: string
        on_time_rate:
          type: number
        dispute_rate:
          type: number
        fill_rate:
          type: number
        jobs_completed:
          type: integer
        reason:
          type: string
        quoted_amount:
          type: number
          nullable: true
          description: >-
            Populated from this worker's JobOffer for this job, if one was
            submitted via POST /jobs/{id}/offers — null otherwise.
        availability_note:
          type: string
          nullable: true
        quoted_at:
          type: string
          format: date-time
          nullable: true
    JobOfferCreate:
      type: object
      required: [quoted_amount]
      properties:
        quoted_amount:
          type: number
          exclusiveMinimum: 0
        availability_note:
          type: string
          nullable: true
    JobOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        quoted_amount:
          type: number
        availability_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MyOffer:
      description: >-
        A worker's own submitted JobOffer, flattened with enough job
        context to render without a second fetch per row.
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        quoted_amount:
          type: number
        availability_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        job_trade:
          type: string
          enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
        job_suburb:
          type: string
        job_status:
          type: string
          enum: [REQUESTED, MATCHED, BOOKED, IN_PROGRESS, DISPUTED, COMPLETED, CANCELLED]
    OpenJob:
      type: object
      description: >-
        Worker-facing view of a still-open job — deliberately omits
        address/landmark_narrative/latitude/longitude/buyer_id, matching
        the existing "address hidden from workers until booking" principle.
      properties:
        job_id:
          type: string
          format: uuid
        trade:
          type: string
          enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
        suburb:
          type: string
        budget_amount:
          type: number
          nullable: true
        problem_description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        distance_band:
          type: string
          enum: [SAME_SUBURB, NEARBY, MODERATE, FAR]
        distance_km:
          type: number
    Skill:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        trade:
          type: string
          enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
        grade:
          type: string
          nullable: true
        proof_url:
          type: string
          nullable: true
    ServiceArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        suburb:
          type: string
        travel_means:
          type: string
          nullable: true
    Standing:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        grade:
          type: string
        on_time_rate:
          type: number
        dispute_rate:
          type: number
        fill_rate:
          type: number
        jobs_completed:
          type: integer
        is_frozen:
          type: boolean
          description: >
            True while this worker has any job currently under an open
            dispute. Computed, not stored — never dropped, per the
            "worker's worst day" design principle.
    WorkerVetting:
      type: object
      description: Progressive vetting evidence and computed grade (ADR-005).
      properties:
        worker_id:
          type: string
          format: uuid
        id_photo_url:
          type: string
          nullable: true
        id_submitted_at:
          type: string
          format: date-time
          nullable: true
        reference_count:
          type: integer
        vouch_count:
          type: integer
          description: Total vouches received, regardless of voucher grade validity.
        grade:
          type: string
    WorkerReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time
    WorkerVouch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
          description: The worker being vouched for.
        voucher_id:
          type: string
          format: uuid
          description: The vouching worker.
        created_at:
          type: string
          format: date-time
    Suburb:
      type: object
      properties:
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    Crew:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        member_ids:
          type: array
          items:
            type: string
            format: uuid
    CrewOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        crew_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [REQUESTED, MATCHED, BOOKED, IN_PROGRESS, COMPLETED, CANCELLED]
        trade:
          type: string
          enum: [PLUMBING, ELECTRICAL, SOLAR, WELDING, BUILDING, APPLIANCE_REPAIR]
        suburb:
          type: string
        address:
          type: string
          description: Only present for the buyer, the booked crew's lead, or OPS.
        landmark_narrative:
          type: string
          nullable: true
          description: >-
            Optional navigation description (e.g. "blue gate opposite the
            clinic"), gated the same as address.
        latitude:
          type: number
          nullable: true
          description: Optional GPS pin, gated the same as address.
        longitude:
          type: number
          nullable: true
          description: Optional GPS pin, gated the same as address.
        workers_needed:
          type: integer
        problem_description:
          type: string
          nullable: true
        currency:
          type: string
          enum: [USD, ECOCASH, ZWG]
          nullable: true
          description: Set once at booking (ADR-002); nullable until then.
        labor_amount:
          type: number
          nullable: true
          description: >-
            Set together with materials_amount by
            POST /crew-orders/{id}/quote (ADR-003).
        materials_amount:
          type: number
          nullable: true
        quote_amount:
          type: number
          nullable: true
          description: Computed server-side as labor_amount + materials_amount.
        completion_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CrewMatchCandidate:
      type: object
      properties:
        crew_id:
          type: string
          format: uuid
        crew_name:
          type: string
          nullable: true
        lead_id:
          type: string
          format: uuid
        qualifying_members:
          type: integer
        total_members:
          type: integer
        distance_band:
          type: string
          enum: [SAME_SUBURB, NEARBY, MODERATE, FAR]
        distance_km:
          type: number
        reason:
          type: string
    CrewOrderLedgerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        crew_order_id:
          type: string
          format: uuid
        amount:
          type: number
        entry_type:
          type: string
          enum: [DEPOSIT_HELD, BALANCE_COMMITTED, RELEASED, REFUNDED]
        currency:
          type: string
          enum: [USD, ECOCASH, ZWG]
        external_reference:
          type: string
          nullable: true
          description: Gateway transaction reference (ADR-002), set only for ECOCASH entries.
        created_at:
          type: string
          format: date-time
    EcoCashConfig:
      type: object
      properties:
        provider:
          type: string
        merchant_code:
          type: string
          nullable: true
        base_url:
          type: string
          nullable: true
        is_sandbox:
          type: boolean
        api_key_configured:
          type: boolean
          description: Whether an api_key is set — the key itself is never returned.
        updated_at:
          type: string
          format: date-time
          nullable: true
