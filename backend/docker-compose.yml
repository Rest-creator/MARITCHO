# Explicit project name: the folder is called "backend", which collides with other
# compose projects on the same machine when left to the default.
name: maricho

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maricho
    ports:
      - "${MARICHO_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${MARICHO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/maricho
      REDIS_URL: redis://redis:6379/0
      # Dev-only placeholder — override with a real secret outside local dev.
      SECRET_KEY: dev-only-secret-change-in-real-deployments
    ports:
      - "${MARICHO_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The web app and its BFF (ADR-009): http://localhost:${MARICHO_WEB_PORT:-3000}.
  # Same image as production (frontend/Dockerfile). The browser's live-chat
  # socket goes straight to the API, so it is built with the API's host port.
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://127.0.0.1:${MARICHO_API_PORT:-8000}
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${MARICHO_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r => { if (!r.ok) process.exit(1) }, () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
