<!doctype html><html><head><meta charset="utf-8"><title>Post a job</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FBBF24;text-decoration:none}a:hover{color:#FCD34D}
textarea::placeholder,input::placeholder{color:#94A3B8}
</style>
<style>html,body{margin:0;background:#0F172A}</style></head><body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0F172A;color:#F1F5F9;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden">
<div style="position:absolute;width:340px;height:340px;left:-140px;top:60px;border-radius:50%;background:#B45309;opacity:0.36;filter:blur(90px)"></div>
<div style="position:absolute;width:300px;height:300px;right:-150px;top:360px;border-radius:50%;background:#3F6B57;opacity:0.45;filter:blur(90px)"></div>
<div style="position:absolute;width:280px;height:280px;left:-40px;bottom:-140px;border-radius:50%;background:#92400E;opacity:0.35;filter:blur(90px)"></div>
</div>
<div style="position:relative;height:100%;box-sizing:border-box;padding:52px 20px 28px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<a href="EmployerHome.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:#F1F5F9">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<h1 style="margin:0;font-size:20px;font-weight:700">Post a job</h1>
</div>
<a href="TradePicker.dc.html" style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#F1F5F9">
<div style="width:42px;height:42px;border-radius:12px;background:rgba(245,158,11,0.16);border:1px solid rgba(245,158,11,0.35);display:flex;align-items:center;justify-content:center;color:#FBBF24">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:12px;font-weight:600;color:#94A3B8">What needs doing?</div>
<div style="margin-top:2px;font-size:16px;font-weight:700">Plumber</div>
</div>
<div style="font-size:13px;font-weight:600;color:#FBBF24">Change</div>
</a>
<div style="padding:14px 16px;border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<label for="pj-desc" style="font-size:14px;font-weight:700">Describe the job</label>
<div style="font-size:12px;color:#94A3B8">96 / 300</div>
</div>
<textarea id="pj-desc" rows="4" style="margin-top:10px;width:100%;box-sizing:border-box;resize:none;padding:0;border:0;outline:none;background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 25px, rgba(255,255,255,0.08) 25px, rgba(255,255,255,0.08) 26px);background-color:transparent;color:#F1F5F9;font:500 15px/26px 'Plus Jakarta Sans',system-ui,sans-serif">Pipe under the kitchen sink is leaking and the cupboard floor is wet. Water is off for now.</textarea>
<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
<div style="width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#475569,#334155);border:1px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:10px;color:#CBD5E1">Photo</div>
<div style="width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#57534E,#44403C);border:1px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:10px;color:#CBD5E1">Photo</div>
<button style="height:52px;flex:1;border-radius:12px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.22);color:#E2E8F0;display:flex;align-items:center;justify-content:center;gap:6px;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Add photo</button>
<button aria-label="Record a voice note instead" style="width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);color:#E2E8F0;display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
</div>
<button style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);color:#F1F5F9;text-align:left;font-family:inherit;cursor:pointer">
<div style="width:42px;height:42px;border-radius:12px;background:rgba(16,185,129,0.14);display:flex;align-items:center;justify-content:center;color:#34D399">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:12px;font-weight:600;color:#94A3B8">Where is the job?</div>
<div style="margin-top:2px;font-size:15px;font-weight:700">14 Harrow Rd, Borrowdale</div>
</div>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<div style="padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">
<div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#94A3B8">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>When do you need this?</div>
<div style="margin-top:10px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
<button aria-pressed="true" style="height:44px;border-radius:12px;background:#F59E0B;border:0;color:#1C1917;font:700 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer">Today</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);color:#E2E8F0;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer">This week</button>
<button aria-pressed="false" style="height:44px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);color:#E2E8F0;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer">Pick a date</button>
</div>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">
<label for="pj-budget" style="flex:1;min-width:0">
<div style="font-size:12px;font-weight:600;color:#94A3B8">Your budget (optional)</div>
<div style="margin-top:2px;font-size:12px;color:#94A3B8">Workers can still suggest a price</div>
</label>
<div style="display:flex;align-items:center;height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14)">
<span style="font-size:15px;font-weight:700;color:#CBD5E1">US$</span>
<input id="pj-budget" type="text" value="30" style="width:44px;margin-left:6px;background:transparent;border:0;outline:none;color:#F1F5F9;font:700 16px 'Plus Jakarta Sans',system-ui,sans-serif">
</div>
</div>
<div style="flex:1"></div>
<a href="Applicants.dc.html" style="height:56px;border-radius:16px;background:#F59E0B;color:#1C1917;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700">Find someone for this job
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</div>
</body></html>
