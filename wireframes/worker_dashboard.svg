<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background-color: #f0f2f5; font-family: sans-serif;">
  <!-- Header / Offline Bar -->
  <rect x="0" y="0" width="375" height="60" fill="#333333"/>
  <circle cx="30" cy="30" r="8" fill="#ff4444"/>
  <text x="50" y="36" font-size="16" font-weight="bold" fill="#ffffff">OFFLINE MODE</text>
  <text x="270" y="36" font-size="14" fill="#aaaaaa">☁ Saved locally</text>

  <!-- Job Alert Card -->
  <rect x="20" y="80" width="335" height="220" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="20" y="80" width="335" height="40" fill="#fffae6" rx="8"/> <!-- Highlight header -->
  <text x="40" y="105" font-size="14" font-weight="bold" fill="#d48806">NEW JOB ALERT</text>
  <text x="280" y="105" font-size="14" fill="#666666">#12345</text>
  
  <text x="40" y="145" font-size="18" font-weight="bold" fill="#000000">Residential Plumbing Repair</text>
  <text x="40" y="170" font-size="14" fill="#666666">Location: 789 Oak St. (Suburbs)</text>
  
  <rect x="40" y="185" width="150" height="26" rx="4" fill="#e6f4ea"/>
  <text x="50" y="203" font-size="14" font-weight="bold" fill="#137333">Deposit: $150 SECURED</text>

  <!-- Actions -->
  <rect x="40" y="235" width="140" height="44" rx="8" fill="#333333"/>
  <text x="110" y="262" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ACCEPT</text>
  
  <rect x="195" y="235" width="140" height="44" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
  <text x="265" y="262" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">PASS</text>

  <!-- Active Jobs Section -->
  <text x="20" y="340" font-size="16" font-weight="bold" fill="#666666">MY ACTIVE JOBS</text>
  
  <rect x="20" y="360" width="335" height="240" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <text x="40" y="390" font-size="16" font-weight="bold" fill="#000000">Current Job: HVAC Service</text>
  <text x="40" y="415" font-size="14" fill="#666666">Location: 456 Elm Ave.</text>
  <text x="40" y="440" font-size="14" fill="#000000">Status: <tspan fill="#d48806">In Progress</tspan></text>

  <!-- Check In Button -->
  <rect x="40" y="465" width="295" height="50" rx="8" fill="#333333"/>
  <text x="187.5" y="495" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">⏱ CHECK IN (Offline)</text>

  <!-- Photos -->
  <text x="80" y="540" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">BEFORE</text>
  <rect x="40" y="550" width="80" height="80" rx="4" fill="#f8f9fa" stroke="#cccccc" stroke-dasharray="4"/>
  <text x="80" y="595" font-size="24" fill="#cccccc" text-anchor="middle">+</text>

  <text x="170" y="540" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">AFTER</text>
  <rect x="130" y="550" width="80" height="80" rx="4" fill="#f8f9fa" stroke="#cccccc" stroke-dasharray="4"/>
  <text x="170" y="595" font-size="24" fill="#cccccc" text-anchor="middle">+</text>

  <!-- Sign off Button (Disabled) -->
  <rect x="225" y="550" width="110" height="80" rx="8" fill="#e0e0e0"/>
  <text x="280" y="590" font-size="14" font-weight="bold" fill="#999999" text-anchor="middle">REQUEST</text>
  <text x="280" y="610" font-size="14" font-weight="bold" fill="#999999" text-anchor="middle">SIGN-OFF</text>

</svg>
